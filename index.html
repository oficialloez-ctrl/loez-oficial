<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOEZ | Hub Oficial - Press Kit</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070709;
      --card: #111115;
      --card-hover: #17171d;
      --accent: #e61919;
      --accent-glow: rgba(230, 25, 25, 0.35);
      --spotify: #1DB954;
      --tiktok: #00f2fe;
      --instagram: #E1306C;
      --whatsapp: #25D366;
      --drive: #4285F4;
      --mail: #ff9800;
      --text: #f4f4f6;
      --text-muted: #8e8e99;
      --border: #202028;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 2rem 1.2rem 4rem;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(230, 25, 25, 0.22), transparent 45%),
        radial-gradient(circle at 10% 90%, rgba(230, 25, 25, 0.08), transparent 30%);
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    /* Perfil */
    .profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0.5rem;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      background-color: var(--card);
      display: block;
    }

    .verified-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: var(--accent);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      border: 3px solid var(--bg);
    }

    .artist-name {
      font-family: 'Syne', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .artist-tagline {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 440px;
    }

    /* Redes rápidas no topo */
    .quick-socials {
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      margin-top: 1.2rem;
    }

    .social-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .social-circle:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .social-circle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Player do Spotify */
    .highlight-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      position: relative;
    }

    .highlight-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
      color: var(--spotify);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .highlight-label::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--spotify);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--spotify);
    }

    .spotify-player-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 352px;
    }

    .spotify-frame {
      width: 100%;
      height: 352px;
      border: none;
      display: block;
    }

    @media (max-width: 600px) {
      .spotify-player-wrap {
        min-height: 260px;
      }

      .spotify-frame {
        height: 260px;
      }
    }

    /* Seções */
    .section-heading {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.8rem;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.05rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .link-item:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .link-info {
      display: flex;
      flex-direction: column;
    }

    .link-info .title {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .link-info .desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .arrow-icon {
      color: var(--text-muted);
      font-size: 1.25rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-item:hover .arrow-icon {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* Galeria Mini */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .photo-grid img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: transform 0.3s ease;
    }

    .photo-grid img:hover {
      transform: scale(1.03);
      border-color: var(--accent);
    }

    /* Botão Principal de Booking / WhatsApp */
    .booking-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 6px 28px var(--accent-glow);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: all 0.25s ease;
    }

    .booking-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(230, 25, 25, 0.65);
      background: #f02424;
    }

    .booking-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 1rem;
    }
  
.photo-grid img {
  cursor:pointer;
  box-shadow:0 0 18px rgba(255,20,20,.12);
}

.photo-grid img:hover {
  box-shadow:0 0 25px rgba(255,20,20,.45);
}


.video-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:1rem;
}

.video-grid video{
  width:100%;
  border-radius:16px;
  border:1px solid rgba(255,32,32,.45);
  background:#000;
  box-shadow:0 0 20px rgba(255,20,20,.18);
}







.video-carousel{
  display:flex;
  gap:16px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  width:100%;
  padding-bottom:10px;
}

.video-card{
  flex:0 0 100%;
  scroll-snap-align:center;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,32,32,.5);
  background:#000;
}

.video-card video{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  display:block;
  background:#000;
}


.video-carousel{
  display:flex;
  gap:16px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  align-items:flex-start;
}

.video-carousel::-webkit-scrollbar{
  display:none;
}

.video-card{
  flex:0 0 auto;
  width:fit-content;
  max-width:100%;
  scroll-snap-align:center;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,32,32,.45);
  background:#000;
}

.video-card video{

<script>
(function(){
  function initCarousel(){
    const carousel = document.getElementById('videoCarousel');
    const next = document.getElementById('videoNext');
    const prev = document.getElementById('videoPrev');

    if(!carousel || !next || !prev) return;

    next.onclick = function(e){
      e.preventDefault();
      carousel.scrollLeft = carousel.scrollLeft + carousel.clientWidth;
    };

    prev.onclick = function(e){
      e.preventDefault();
      carousel.scrollLeft = carousel.scrollLeft - carousel.clientWidth;
    };
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initCarousel);
  } else {
    initCarousel();
  }
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const videos = document.querySelectorAll("video");

    videos.forEach(video => {
        video.addEventListener("play", function () {
            videos.forEach(outroVideo => {
                if (outroVideo !== video) {
                    outroVideo.pause();
                }
            });
        });
    });
});
</script>
